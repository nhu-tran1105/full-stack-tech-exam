<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Stack Tech Exam</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="main-card">
    <h1>Full Stack Tech Exam</h1>
    
    <div class="section-container">
      <h2>Setup My Profile</h2>
      <button id="initBtn">Register Me</button>
      <p id="initStatus" class="error-text"></p>
    </div>

    <div class="section-container">
      <h2>Find Server</h2>
      <form id="nameForm" class="row">
        <label for="userName">Enter name:</label>
        <input type="text" id="userName" name="userName" placeholder="Enter a name (e.g., barry)" required>
        <button type="submit">Search</button> 
      </form>
      
      <p id="result"></p>
    </div>
  </div>

  <script src="/js/scripts.js" type="module"></script>
</body>

</html>
